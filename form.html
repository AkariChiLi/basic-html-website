<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赤黎的垃圾站</title>

    <link rel="stylesheet" href="mainstyle.css">

    <style>
        *{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .form-container {
            display: flex;
            justify-content:space-between;
            align-items: stretch;
            border: 1px solid #ccc;
            padding: 20px;
            width: 500px;
            min-height:430px;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

       .form-input{
           flex: 1;
       }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .form-input button {
            width: 100%;
            padding: 10px;
            background-color: rgb(255,149,0);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .form-progress {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 160px;
            margin-left: 20px;
            align-self:stretch;
        }

        .progress-round {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #ccc;
            position: relative;
            margin: 0 auto;
        }

        .progress-round p {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .progress-title {
            text-align: center;
        }

        .progress-catalog {
            display: flex;
            flex-direction: column;
            background-color: #ccc;
            padding: 10px;
            border-radius: 10px;
            height: 50%;
        }

        .progress-group{
            margin-bottom: 10px;
        }
    </style>

</head>
<body>
    <header>
     <div class="logo">
         <img src="logo.png" alt="Logo">
         <span>AkariChiLi's Blog</span> 
     </div>  
   </header>

     <nav id="nav">
       <a href="Basic HTML HomePage.html">Home</a>
       <a href="Basic HTML Projects.html">Projects</a>
       <a href="Basic HTML Articles.html">Articles</a>
       <a href="Basic HTML Contact Page.html">Contact</a>
     </nav> 

     <div class="form-container">
            <form class="form-input">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>


                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>


                    <div class="form-group">
                        <label for="password">Enter Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>


                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>


                    <button type="submit">Update Profile</button>
             </form>

                 <div class="form-progress">
                        <div class="progress-round">
                            <p>100%</p>
                        </div>

                        <div class="progress-title">
                            <p>Profile Completeness</p>
                        </div>

                        <div class="progress-catalog">
                            <div class="progress-group">
                                <p>Create Account</p>
                            </div>

                            <div class="progress-group">
                                <p>Setup Profile</p>
                            </div>

                            <div class="progress-group">
                                <p>Invite your Friends</p>
                            </div>

                        </div>

                   </div>

        </div>
     </body>

 <footer>
      <div class="footer-content">
         <p>Copyright &copy; 2026 AkariChiLi's Blog. All rights reserved.</p>
      </div>
   </footer>
</html>
