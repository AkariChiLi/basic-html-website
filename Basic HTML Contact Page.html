<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赤黎的垃圾站</title>
     <link rel="stylesheet" href="mainstyle.css">

</head>
<body>
    <header>
    <div class="logo">
         <img src="logo.png" alt="Logo">
         <span>AkariChiLi's Blog</span> 
    </div>
   </header>

  <nav id="nav">
       <div class="nav-item">
        <a href="Basic HTML HomePage.html">Home</a>
        <div class="tooltip">This is Home</div>
      </div>

       <div class="nav-item">
        <a href="Basic HTML Projects.html">Projects</a>
        <div class="tooltip">All my projects</div>
      </div>

       <div class="nav-item">
        <a href="Basic HTML Articles.html">Articles</a>
        <div class="tooltip">All my articles</div>
      </div>

       <div class="nav-item">
        <a href="Basic HTML Contact Page.html">Contact</a>
        <div class="tooltip">Contact me</div>
      </div>
      
     </nav> 
     
   <main>
    <h1>联系我们</h1>
    <form>
    <section id="content">
       <div>
         <label for="username">你的用户名</label>
        <input type="text" 
              id="username" 
              name="username" 
              required
              placeholder="请输入内容">
       </div>


       <div>
         <label for="email">你的邮箱</label>
         <input type="email" 
                id="email" 
                name="email" 
                required
                placeholder="请输入内容">
        </div>

        <div>
         <label for="message">你的消息</label>
        <textarea id="message" 
                  name="message" 
                  rows="4" 
                  cols="50" 
                  required
                  placeholder="请输入内容">
        </textarea>
        </div>

        <button type="submit">发送</button>
    </section>
    </form>

    <form action="#"></form>
   </main>

  <footer>
      <div class="footer-content">

  </footer>

</html>
