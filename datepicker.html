<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赤黎的垃圾站</title>
    <link rel="stylesheet" href="mainstyle.css">
    <style>
        *{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .choose{
          width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .datepicker {
            width: 300px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .datehead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .datehead h2{
            margin:0;
            font-size: 24px;
            font-weight: bold;
        }

        .week {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .days div {
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
     <div class="logo">
         <img src="logo.png" alt="Logo">
         <span>AkariChiLi's Blog</span> 
     </div>  
   </header>

     <nav id="nav">
       <a href="Basic HTML HomePage.html">Home</a>
       <a href="Basic HTML Projects.html">Projects</a>
       <a href="Basic HTML Articles.html">Articles</a>
       <a href="Basic HTML Contact Page.html">Contact</a>
     </nav> 

     <div class="choose">
        <input type="text" id="datepicker-input" placeholder="dd / mm/ yyyy">
        <button>Select Date</button>
     </div>

     <div class="datepicker">

       <div class="datehead">
            <button>&lt;</button>
            <h2>October 2026</h2>
            <button>&gt;</button>
       </div>

       <div class="week">
            <div>S</div>
            <div>M</div>
            <div>T</div>
            <div>W</div>
            <div>T</div>
            <div>F</div>
            <div>S</div>
       </div>

       <div class="days">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
            <div>13</div>
            <div>14</div>
            <div>15</div>
            <div>16</div>
            <div>17</div>
            <div>18</div>
            <div>19</div>
            <div>20</div>
            <div>21</div>
            <div>22</div>
            <div>23</div>
            <div>24</div>
            <div>25</div>
            <div>26</div>
            <div>27</div>
            <div>28</div>
            <div>29</div>
            <div>30</div>
            <div>31</div>
        </div>

     </div>

    
</body>
